[project]
name = "ndvi-monitor"
version = "0.1.0"
description = "Восстановление пропусков NDVI и детекция аномалий (Космохакатон, Ростов)"
requires-python = ">=3.12"
dependencies = [
    "pandas>=2.2",
    "numpy>=1.26",
    "scipy>=1.13",
    "scikit-learn>=1.5",
    "matplotlib>=3.9",
]

[project.optional-dependencies]
web = ["fastapi>=0.115", "uvicorn>=0.30", "httpx>=0.27"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ndvi"]
