[project]
name = "kosmohack"
version = "0.1.0"
requires-python = ">=3.14"
dependencies = [
    "matplotlib>=3.11.1",
    "numpy>=2.5.2",
    "pandas>=3.0.5",
    "polars>=1.44.1",
    "pyarrow>=25.0.1",
    "scipy>=1.18.1",
    "seaborn>=0.13.2",
]

[dependency-groups]
agent = [
    "anthropic>=1.3.0",
    "mcp>=2.1.1",
    "ollama>=0.6.2",
    "openai>=3.8.0",
    "pydantic-ai>=2.39.0",
]
dev = [
    "mypy>=2.3.1",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "ruff>=0.16.6",
]
dl = [
    "chronos-forecasting>=2.3.1",
    "pygrinder>=0.7",
    "pypots>=1.5",
    "torch>=2.14.0",
]
geo = [
    "earthaccess>=0.19.0",
    "earthengine-api>=1.7.42",
    "geopandas>=1.1.4",
    "odc-stac>=0.5.3",
    "openmeteo-requests>=1.7.5",
    "osmnx>=2.1.1",
    "overpy>=0.7",
    "planetary-computer>=1.0.0",
    "pyproj>=3.7.2",
    "pystac>=1.15.2",
    "pystac-client>=0.9.0",
    "rasterio>=1.5.1",
    "rioxarray>=0.23.0",
    "shapely>=2.1.2",
    "stackstac>=0.5.0",
    "xarray>=2026.7.0",
]
ml = [
    "catboost>=1.2.10",
    "lightgbm>=4.7.0",
    "optuna>=4.9.0",
    "scikit-learn>=1.9.0",
    "shap>=0.52.0",
    "statsmodels>=0.15.0",
    "stumpy>=1.10.2",
    "whittaker-eilers>=0.2.0",
    "xgboost>=3.4.1",
]
openeo = [
    "openeo>=0.47.0",
]
service = [
    "duckdb>=1.5.5",
    "fastapi>=0.141.1",
    "httpx>=0.28.1",
    "orjson>=3.12.0",
    "plotly>=7.0.0",
    "pydantic>=2.13.5",
    "pydantic-settings>=2.15.0",
    "python-dotenv>=1.2.3",
    "uvicorn[standard]>=0.52.4",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.uv]
# openeo (клиент Copernicus Data Space) требует xarray<2025.1.2 и несовместим с современным geo-стеком,
# поэтому живёт в отдельной группе: uv sync --group openeo
conflicts = [[{ group = "geo" }, { group = "openeo" }]]

# torch с CUDA 13.0 для RTX 5070 (Blackwell, sm_120): на PyPI под Windows лежит CPU-сборка,
# поэтому torch берём из индекса PyTorch (explicit = true — только для torch)
[[tool.uv.index]]
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"
explicit = true

[tool.uv.sources]
torch = [{ index = "pytorch-cu130", marker = "sys_platform == 'win32' or sys_platform == 'linux'" }]
