# Запуск всего продукта одной командой: docker compose up --build
# После сборки интерфейс и API доступны на http://localhost:8000/
services:
  app:
    build: .
    image: kosmohack-ndvi:latest
    ports:
      - "8000:8000"
    environment:
      NOMINATIM_URL: ${NOMINATIM_URL:-https://nominatim.openstreetmap.org/search}
      GEOCODING_USER_AGENT: ${GEOCODING_USER_AGENT:-kosmohack-ndvi-monitor/1.0}
      # Ключ нужен только для связных объяснений и ответов агента;
      # без него текст формируется по правилам, сервис работает полностью.
      OLLAMA_API_KEY: ${OLLAMA_API_KEY:-}
      NDVI_LLM_MODEL: ${NDVI_LLM_MODEL:-}
    volumes:
      # Всё, что сервис пишет во время работы, переживает перезапуск контейнера:
      # набор полей пользователя (artifacts/service), отчёты собранных полей (artifacts/fields)
      # и кэш погоды ERA5 (artifacts/weather).
      - runtime-data:/app/artifacts
    restart: unless-stopped

volumes:
  runtime-data:
