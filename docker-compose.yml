# Запуск всего продукта одной командой: docker compose up --build
# После сборки интерфейс и API доступны на http://localhost:8000/
services:
  app:
    build: .
    image: kosmohack-ndvi:latest
    ports:
      - "8000:8000"
    environment:
      # Ключ нужен только для связного объяснения аномалий языковой моделью;
      # без него текст формируется по правилам.
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
    volumes:
      # Всё, что сервис пишет во время работы, переживает перезапуск контейнера:
      # набор полей пользователя (artifacts/service), отчёты собранных полей (artifacts/fields)
      # и кэш погоды ERA5 (artifacts/weather).
      - runtime-data:/app/artifacts
    restart: unless-stopped

volumes:
  runtime-data:
